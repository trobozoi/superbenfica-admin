# Pipeline de qualidade: typecheck -> lint -> testes com cobertura -> build -> SonarQube.
# Análise no SonarQube Cloud (sonarcloud.io). Secret necessário: SONAR_TOKEN.
# Os testes E2E dependem da API real e rodam localmente (npm run test:e2e).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    env:
      API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o Sonar calcular "new code"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Análise SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
