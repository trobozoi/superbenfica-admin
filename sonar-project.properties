# Configuração do SonarScanner para o Super Benfica Admin (SonarQube Cloud).
# O token (SONAR_TOKEN) vem do secret do GitHub Actions ou da variável de ambiente local.

sonar.organization=trobozoi
sonar.projectKey=trobozoi_superbenfica-admin
sonar.projectName=Super Benfica Admin
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx

# Relatório gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.d.ts
# Páginas, layouts e componentes visuais são validados pelos testes E2E (Playwright),
# que não geram lcov. A lógica (config, lib, services, store) tem cobertura de unidade.
sonar.coverage.exclusions=src/app/**,src/components/**,src/hooks/**,src/i18n/**,src/messages/**,src/types/**,src/proxy.ts,src/lib/server/**,src/features/**/components/**,src/features/**/hooks.ts
sonar.cpd.exclusions=src/components/ui/**
